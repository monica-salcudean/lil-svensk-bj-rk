<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>lil svensk björn</title>
<meta name="theme-color" content="#2f6fb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Svensk Björn">
<style>
  :root{
    --bg:#eef3f6; --bg2:#e4eef2; --card:#ffffff; --ink:#223040; --muted:#73879a;
    --line:#dde8ef; --accent:#2f80c4; --accent-ink:#1b5e94; --warm:#f2b84b; --warm-ink:#9c6d12;
    --good:#4caf7d; --good-bg:#e4f5ec; --bad:#e3675f; --bad-bg:#fbe8e7; --cream:#fbf6ec;
    --shadow:0 8px 28px rgba(31,45,61,.08); --r:20px;
  }
  [data-theme="dark"]{
    --bg:#10171f; --bg2:#0c1219; --card:#19222d; --ink:#e7eef5; --muted:#8fa3b5;
    --line:#26323f; --accent:#5aa6e0; --accent-ink:#92c7ef; --warm:#f2b84b; --warm-ink:#f4d079;
    --good:#5cbf90; --good-bg:#16302a; --bad:#e3807a; --bad-bg:#351f1f; --cream:#1f2731;
    --shadow:0 8px 28px rgba(0,0,0,.4); --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;color:var(--ink);
    -webkit-font-smoothing:antialiased;padding-bottom:92px;transition:background .3s,color .3s}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;padding:10px 4px 18px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem;letter-spacing:-.3px}
  .logo .bear-mini{width:40px;height:40px;flex:none;background:#fbeaa6;border-radius:11px;display:grid;place-items:center}
  .logo .bear-mini svg{width:34px;height:34px}
  .spacer{flex:1}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);min-width:40px;height:40px;padding:0 10px;
    border-radius:12px;cursor:pointer;font-size:1.05rem;display:grid;place-items:center;box-shadow:var(--shadow)}
  .iconbtn:active{transform:scale(.94)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  h2{font-size:1.05rem;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:.86rem;line-height:1.45}
  .sv{position:relative;cursor:help;border-bottom:1px dotted transparent}
  .sv[data-es]{border-bottom-color:var(--line)}
  .sv[data-es]:hover::after,.sv.show::after{content:attr(data-es);position:absolute;left:50%;bottom:140%;transform:translateX(-50%);
    background:var(--ink);color:var(--card);padding:5px 9px;border-radius:8px;font-size:.78rem;white-space:nowrap;z-index:40;box-shadow:var(--shadow);font-weight:600;pointer-events:none}
  .sv[data-es]:hover::before,.sv.show::before{content:"";position:absolute;left:50%;bottom:140%;transform:translate(-50%,60%) rotate(45deg);width:8px;height:8px;background:var(--ink);z-index:40}
  .hero{background:linear-gradient(145deg,var(--accent),var(--accent-ink));color:#fff;border:none;position:relative;overflow:hidden}
  .hero .bear-big{width:128px;height:128px;position:absolute;right:-10px;bottom:-16px;opacity:.97}
  .hero h1{font-size:1.5rem;margin-bottom:6px;max-width:66%;line-height:1.2}
  .hero p{opacity:.92;font-size:.9rem;max-width:62%}
  .snow{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--accent-ink)}
  .stat .l{font-size:.72rem;color:var(--muted);margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;position:relative;overflow:hidden}
  .cat:active{transform:scale(.97)}
  .cat.off{opacity:.5}
  .cat .ico{font-size:1.7rem}
  .cat .t{font-weight:700;margin-top:6px}
  .cat .e{font-size:.78rem;color:var(--muted)}
  .cat .lvltag{position:absolute;top:10px;left:12px;font-size:.6rem;font-weight:800;color:var(--muted);letter-spacing:.5px}
  .cat .bar{height:6px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden}
  .cat .bar i{display:block;height:100%;background:var(--warm);border-radius:5px;width:0;transition:width .5s}
  .cat .pct{font-size:.7rem;color:var(--muted);margin-top:4px}
  .cat .toggle{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:.8rem;cursor:pointer}
  .cat .toggle.on{background:var(--good);border-color:var(--good);color:#fff}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.warm{background:var(--warm);color:var(--warm-ink)}
  .btn.block{width:100%;margin-top:6px}
  .btn.sm{padding:8px 12px;font-size:.82rem}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .pill{display:inline-block;background:var(--bg);border:1.5px solid var(--line);border-radius:20px;padding:7px 15px;font-size:.85rem;margin:3px 5px 0 0;color:var(--muted);cursor:pointer;font-weight:700}
  .pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fc{perspective:1200px;margin:8px 0}
  .fc-inner{position:relative;min-height:268px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
  .fc.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--shadow)}
  .fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card),var(--bg))}
  .fc .word{font-size:1.8rem;font-weight:800}
  .fc .pos{font-size:.75rem;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:20px;margin-top:8px}
  .fc .emoji{font-size:3.6rem;line-height:1;margin-bottom:6px}
  .fc .es{font-size:1.5rem;font-weight:700;color:var(--accent-ink)}
  .fc .ex{font-size:.9rem;margin-top:12px;color:var(--ink);font-style:italic}
  .fc .exes{font-size:.82rem;color:var(--muted);margin-top:4px}
  .fc .hint{position:absolute;bottom:10px;font-size:.7rem;color:var(--muted)}
  .speak{background:var(--bg);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem;margin-top:12px;color:var(--accent-ink)}
  .progress-dots{display:flex;gap:5px;justify-content:center;margin:10px 0;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.done{background:var(--good)} .dot.now{background:var(--accent);transform:scale(1.4)}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;font-size:1rem;color:var(--ink);transition:.15s;font-weight:600}
  .opt:active{transform:scale(.98)}
  .opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .opt.dim{opacity:.5}
  .q{font-size:1.25rem;font-weight:700;text-align:center;margin:14px 0 18px;line-height:1.4}
  .qbadge{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.4px}
  td.sw{font-weight:700;color:var(--accent-ink)}
  .grp-pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--muted);margin-left:4px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.06);z-index:50}
  nav button{background:none;border:none;color:var(--muted);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 10px;border-radius:12px;font-weight:600}
  nav button .ni{font-size:1.25rem}
  nav button.active{color:var(--accent)} nav button.active .ni{transform:translateY(-2px)}
  .back{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:.9rem;margin-bottom:10px;padding:4px}
  .center{text-align:center}
  .big-emoji{font-size:3rem}
  .mastery{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .m0{background:var(--line)} .m1{background:var(--warm)} .m2{background:var(--good)}
  .wordlist{list-style:none}
  .wordlist li{display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);gap:8px}
  .wordlist .em{font-size:1.1rem;width:22px;text-align:center}
  .wordlist .w{font-weight:700}
  .wordlist .e2{color:var(--muted);font-size:.85rem;margin-left:auto}
  .del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:.9rem;padding:2px 6px}
  .fade{animation:fade .3s} @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .confetti{animation:pop .4s} @keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:30px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.3s}
  .toast.show{opacity:1}
  .field{margin:10px 0}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem;font-family:inherit}
  .ringwrap{position:relative;display:inline-grid;place-items:center}
  .ringwrap .rc{position:absolute;text-align:center;line-height:1.1}
  .rc .rn{font-size:1.3rem;font-weight:800}
  .rc .rl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .xpbar{height:9px;background:rgba(255,255,255,.28);border-radius:6px;overflow:hidden;margin-top:10px;max-width:66%}
  .xpbar i{display:block;height:100%;background:var(--warm);border-radius:6px;transition:width .6s}
  .lvlpill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:20px;font-size:.82rem;font-weight:700}
  .today-card{display:flex;align-items:center;gap:16px}
  .today-card .txt{flex:1}
  .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
  .badge.locked{opacity:.32;filter:grayscale(1)}
  .badge .bi{font-size:1.6rem} .badge .bn{font-size:.62rem;color:var(--muted);margin-top:4px;font-weight:600;line-height:1.1}
  .prof-row{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px}
  .prof-row.cur{border-color:var(--accent);background:var(--bg)}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,184,75,.5)}50%{box-shadow:0 0 0 10px rgba(242,184,75,0)}}
  .glow{animation:glow 1.4s ease-out}
  #printArea{display:none}
  @media print{@page{margin:12mm}
    body{background:#fff;padding:0} .wrap,nav,.toast{display:none!important}
    #printArea{display:block!important;color:#111}
    #printArea h1{font-size:15pt;text-align:center;margin-bottom:3mm}
    #printArea .psub{text-align:center;font-size:9pt;color:#666;margin-bottom:6mm}
    .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
    .pcard{border:1.2pt dashed #aaa;border-radius:4mm;padding:5mm;text-align:center;break-inside:avoid;page-break-inside:avoid}
    .pem{font-size:20pt} .psv{font-size:15pt;font-weight:800;margin-top:1mm} .ppos{font-size:7pt;color:#888;text-transform:uppercase}
    .pes{font-size:11pt;color:#333;margin-top:2mm} .pex{font-size:8.5pt;color:#777;font-style:italic;margin-top:3mm}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="bear-mini" id="bearMini"></span><span>lil svensk&nbsp;björn</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="profBtn" title="Profil">🐻</button>
    <button class="iconbtn" id="themeBtn" title="Ljus/mörk">🌙</button>
  </header>
  <div id="view"></div>
</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ===================== DATABAS ===================== */
const BASE_VOCAB = {
  vardag:{title:"Vardag",es:"Vida diaria",icon:"☕",lvl:"A2",words:[
    {sv:"att vakna",es:"despertarse",pos:"verb",ex:"Jag vaknar klockan sju varje dag.",exEs:"Me despierto a las siete cada día."},
    {sv:"att skynda sig",es:"darse prisa",pos:"verb",ex:"Skynda dig, bussen kommer!",exEs:"¡Date prisa, viene el autobús!"},
    {sv:"en vana",es:"una costumbre",pos:"subst",ex:"Det är en bra vana att läsa.",exEs:"Es una buena costumbre leer."},

    {sv:"ungefär",es:"aproximadamente",pos:"adv",ex:"Det tar ungefär en timme.",exEs:"Lleva aproximadamente una hora."},
    {sv:"att handla",es:"comprar / hacer la compra",pos:"verb",ex:"Jag ska handla mat efter jobbet.",exEs:"Voy a comprar comida después del trabajo."},
    {sv:"ett kvitto",es:"un recibo",pos:"subst",ex:"Får jag ett kvitto, tack?",exEs:"¿Me da un recibo, por favor?"},
    {sv:"att städa",es:"limpiar / ordenar",pos:"verb",ex:"Vi städar lägenheten på lördagar.",exEs:"Limpiamos el piso los sábados."},
    {sv:"trött",es:"cansado/a",pos:"adj",ex:"Jag är så trött idag.",exEs:"Estoy tan cansado hoy."},
    {sv:"att vila",es:"descansar",pos:"verb",ex:"Jag behöver vila en stund.",exEs:"Necesito descansar un rato."},
    {sv:"nästan",es:"casi",pos:"adv",ex:"Jag är nästan klar.",exEs:"Casi he terminado."},
    {sv:"att försöka",es:"intentar",pos:"verb",ex:"Jag försöker lära mig svenska.",exEs:"Intento aprender sueco."},
    {sv:"en möjlighet",es:"una posibilidad",pos:"subst",ex:"Det finns en möjlighet.",exEs:"Hay una posibilidad."},
    {sv:"att bestämma",es:"decidir",pos:"verb",ex:"Vi måste bestämma oss.",exEs:"Tenemos que decidirnos."},
    {sv:"viktig",es:"importante",pos:"adj",ex:"Det här är viktigt.",exEs:"Esto es importante."},
    {sv:"att behöva",es:"necesitar",pos:"verb",ex:"Jag behöver hjälp.",exEs:"Necesito ayuda."},

    {sv:"att smaka",es:"saber (a) / probar",pos:"verb",ex:"Det smakar gott!",exEs:"¡Sabe bien!"},
    {sv:"en rätt",es:"un plato (comida)",pos:"subst",ex:"Vilken rätt vill du ha?",exEs:"¿Qué plato quieres?"},
    {sv:"ett recept",es:"una receta",pos:"subst",ex:"Jag följer ett recept.",exEs:"Sigo una receta."},
    {sv:"att laga mat",es:"cocinar",pos:"verb",ex:"Han lagar mat varje kväll.",exEs:"Él cocina cada noche."},
    {sv:"en ingrediens",es:"un ingrediente",pos:"subst",ex:"Vilka ingredienser behöver vi?",exEs:"¿Qué ingredientes necesitamos?"},
    {sv:"mätt",es:"lleno/a (saciado)",pos:"adj",ex:"Nej tack, jag är mätt.",exEs:"No gracias, estoy lleno."},
    {sv:"hungrig",es:"hambriento/a",pos:"adj",ex:"Jag är jättehungrig.",exEs:"Tengo muchísima hambre."},
    {sv:"att beställa",es:"pedir (en restaurante)",pos:"verb",ex:"Vi beställer två kaffe.",exEs:"Pedimos dos cafés."},
    {sv:"en servitör",es:"un camarero",pos:"subst",ex:"Servitören kommer snart.",exEs:"El camarero viene pronto."},
    {sv:"att provsmaka",es:"degustar / catar",pos:"verb",ex:"Får jag provsmaka?",exEs:"¿Puedo probar?"},
    {sv:"sött",es:"dulce",pos:"adj",ex:"Kakan är för söt.",exEs:"El pastel es demasiado dulce."},
    {sv:"salt",es:"salado / sal",pos:"adj/subst",ex:"Soppan är lite för salt.",exEs:"La sopa está un poco salada."},
    {sv:"en efterrätt",es:"un postre",pos:"subst",ex:"Vill du ha efterrätt?",exEs:"¿Quieres postre?"},
    {sv:"att dricka",es:"beber",pos:"verb",ex:"Jag dricker vatten.",exEs:"Bebo agua."},
    {sv:"nyttigt",es:"sano / saludable",pos:"adj",ex:"Grönsaker är nyttigt.",exEs:"Las verduras son sanas."},
  ]},
  hem:{title:"Hem",es:"El hogar",icon:"🏠",lvl:"A2",words:[
    {sv:"en lägenhet",es:"un piso / apartamento",pos:"subst",ex:"Jag bor i en liten lägenhet.",exEs:"Vivo en un piso pequeño."},
    {sv:"en hyra",es:"un alquiler",pos:"subst",ex:"Hyran är ganska hög.",exEs:"El alquiler es bastante alto."},
    {sv:"att flytta",es:"mudarse",pos:"verb",ex:"Vi flyttar nästa månad.",exEs:"Nos mudamos el mes que viene."},
    {sv:"en granne",es:"un vecino",pos:"subst",ex:"Min granne är trevlig.",exEs:"Mi vecino es simpático."},
    {sv:"ett vardagsrum",es:"un salón",pos:"subst",ex:"Vi sitter i vardagsrummet.",exEs:"Estamos sentados en el salón."},
    {sv:"ett kök",es:"una cocina",pos:"subst",ex:"Köket är nyrenoverat.",exEs:"La cocina está recién reformada."},
    {sv:"en soffa",es:"un sofá",pos:"subst",ex:"Katten sover på soffan.",exEs:"El gato duerme en el sofá."},
    {sv:"ett skåp",es:"un armario",pos:"subst",ex:"Glasen står i skåpet.",exEs:"Los vasos están en el armario."},

    {sv:"en trädgård",es:"un jardín",pos:"subst",ex:"De har en stor trädgård.",exEs:"Tienen un jardín grande."},
    {sv:"en våning",es:"una planta / piso",pos:"subst",ex:"Jag bor på tredje våningen.",exEs:"Vivo en la tercera planta."},
    {sv:"mysigt",es:"acogedor",pos:"adj",ex:"Vilket mysigt rum!",exEs:"¡Qué habitación tan acogedora!"},
    {sv:"att möblera",es:"amueblar",pos:"verb",ex:"Vi ska möblera rummet.",exEs:"Vamos a amueblar la habitación."},
    {sv:"en nyckel",es:"una llave",pos:"subst",ex:"Jag har tappat nyckeln.",exEs:"He perdido la llave."},
    {sv:"att låsa",es:"cerrar con llave",pos:"verb",ex:"Glöm inte att låsa dörren.",exEs:"No olvides cerrar la puerta con llave."},

  kropp:{title:"Kropp & Hälsa",es:"Cuerpo y salud",icon:"🩺",lvl:"A2",words:[

    {sv:"sjuk",es:"enfermo/a",pos:"adj",ex:"Jag är sjuk och stannar hemma.",exEs:"Estoy enfermo y me quedo en casa."},
    {sv:"frisk",es:"sano / recuperado",pos:"adj",ex:"Nu är jag frisk igen.",exEs:"Ahora estoy recuperado otra vez."},
    {sv:"att göra ont",es:"doler",pos:"verb",ex:"Det gör ont i halsen.",exEs:"Me duele la garganta."},

function wordKey(cat,sv){ return cat+"::"+sv; }

let VOCAB={};
function buildVocab(){
  const v={};
  for(const k in BASE_VOCAB){ const b=BASE_VOCAB[k];
    const words=b.words.concat(S.custom[k]||[]).map(w=>({...w,lvl:w.lvl||b.lvl||"A2",img:w.img||EMOJI[w.sv]||""}));

/* ===================== HELPERS ===================== */
const $=(s,r=document)=>r.querySelector(s);
const view=$("#view");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let svVoice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); svVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("sv"))||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(txt){ if(!('speechSynthesis' in window))return toast("Ljud stöds inte här");
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(txt).replace(/^att /,''));
  u.lang="sv-SE"; if(svVoice)u.voice=svVoice; u.rate=.9; speechSynthesis.speak(u); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }
function levelOn(cat){ const c=VOCAB[cat]; if(!c)return false; if(c.custom)return true; return S.levels[c.lvl]!==false; }
function isActive(cat){ return S.active[cat]!==false; }
function studyable(cat){ return levelOn(cat)&&isActive(cat); }
function allWords(){ const o=[]; for(const c in VOCAB) for(const w of VOCAB[c].words) o.push({...w,cat:c}); return o; }
function activeWords(){ const o=[]; for(const c in VOCAB){ if(!studyable(c))continue; for(const w of VOCAB[c].words) o.push({...w,cat:c}); } return o; }
function masteryOf(cat,sv){ return S.mastery[wordKey(cat,sv)]||0; }
function catProgress(cat){ const ws=VOCAB[cat].words; if(!ws.length)return 0; let s=0; ws.forEach(w=>s+=masteryOf(cat,w.sv)); return Math.round(s/(ws.length*2)*100); }
function totalLearned(){ let n=0; for(const k in S.mastery) if(S.mastery[k]>=2)n++; return n; }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function dueWords(){ const now=Date.now(),due=[]; for(const w of activeWords()){ const r=S.srs[wordKey(w.cat,w.sv)]; if(!r||r.next<=now)due.push(w); } return due; }
function srsUpdate(cat,sv,ok){ const k=wordKey(cat,sv); const r=S.srs[k]||{box:0};
  r.box=ok?Math.min(r.box+1,5):Math.max(r.box-1,0); r.next=Date.now()+[0,1,2,4,8,16][r.box]*864e5; S.srs[k]=r;
  const cur=masteryOf(cat,sv); S.mastery[k]=ok?Math.min(cur+1,2):Math.max(cur-1,0); S.totalReviews++; save(); }

/* XP / nivå / mål / märken */
function levelOf(){ let xp=S.xp||0,lvl=1,need=60,acc=0; while(xp>=acc+need){acc+=need;lvl++;need=Math.round(need*1.35);} return {lvl,into:xp-acc,need,xp}; }
function ensureToday(){ const t=new Date().toDateString(); if(!S.today||S.today.date!==t) S.today={date:t,count:0,words:[]}; }
let goalJustHit=false;
function award(ok,xp,word){ ensureToday(); const before=S.today.count; S.today.count++; S.xp=(S.xp||0)+(ok?xp:1);
  if(ok&&word&&word.sv){ if(!S.today.words.some(w=>w.sv===word.sv&&w.cat===word.cat)) S.today.words.push({sv:word.sv,es:word.es,ex:word.ex,pos:word.pos,cat:word.cat,img:word.img||EMOJI[word.sv]||""}); }
  if(before<S.goal&&S.today.count>=S.goal){ goalJustHit=true; setTimeout(()=>toast("🎯 Dagens mål klarat! +"+S.goal),250); }
  checkBadges(); save(); }

      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .7s"/>

  <div class="card fade"><h2>➕ <span class="sv" data-es="Nueva persona">Ny profil</span></h2>
    <div class="field"><label>Namn / Nombre</label><input id="pName" placeholder="Mamma" maxlength="16"></div>
    <div class="field"><label>Figur</label><div id="emojiPick">${PROF_EMOJIS.map(e=>`<button class="pill" data-e="${e}" style="font-size:1.1rem">${e}</button>`).join("")}</div></div>
    <button class="btn block" onclick="doAddProfile()">💾 <span class="sv" data-es="Crear">Skapa</span></button>
  </div>`;
  const pick=$("#emojiPick"); const sync=()=>{ [...pick.children].forEach(b=>b.classList.toggle("on",b.dataset.e===newEmoji)); };
  [...pick.children].forEach(b=>b.onclick=()=>{ newEmoji=b.dataset.e; sync(); }); sync(); $("#pName").focus(); hookHover();
}
function doAddProfile(){ const name=$("#pName").value.trim()||"Ny"; const id=uid();
  PROF.list.push({id,name,emoji:newEmoji}); PROF.cur=id; saveProfiles();
  S=fresh(); S.lastDay=new Date().toDateString(); save(); VOCAB=buildVocab(); applyTheme(); go('hem'); toast("Hej, "+name+"! 🎉"); }
function switchProfile(id){ PROF.cur=id; saveProfiles(); S=loadState(); VOCAB=buildVocab(); applyTheme(); go('hem'); toast("Hej, "+curProfile().name+"!"); }
function askDeleteProfile(id){ const p=PROF.list.find(x=>x.id===id); if(!p)return;
  if(!confirm("¿Borrar el perfil de "+p.name+" y todo su progreso?"))return;
  PROF.list=PROF.list.filter(x=>x.id!==id); try{localStorage.removeItem(DPREFIX+id);}catch(e){}
  if(PROF.cur===id){ PROF.cur=PROF.list[0].id; saveProfiles(); S=loadState(); VOCAB=buildVocab(); applyTheme(); go('hem'); }
  else { saveProfiles(); Profil(); } toast("Profil borttagen"); }

/* ===================== HOVER (touch) ===================== */
function hookHover(){ view.querySelectorAll(".sv[data-es]").forEach(el=>{ el.addEventListener("click",e=>{
  if(window.matchMedia("(hover:none)").matches){ e.stopPropagation();
    document.querySelectorAll(".sv.show").forEach(x=>x!==el&&x.classList.remove("show"));
    el.classList.toggle("show"); setTimeout(()=>el.classList.remove("show"),2200); } }); }); }

/* ===================== INIT ===================== */
$("#themeBtn").onclick=()=>{ const dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",dark?"":"dark"); S.theme=dark?"light":"dark"; save(); $("#themeBtn").textContent=dark?"🌙":"☀️"; };
$("#profBtn").onclick=()=>go('profil');
applyTheme();
$("#bearMini").innerHTML=bearSVG(34,false);

(function pwa(){ const icon="data:image/svg+xml,"+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#fbeaa6"/><g transform="translate(66,70) scale(3.8)">`+bearSVG(100,false).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')+`</g></svg>`);
  try{ if(!document.querySelector('link[rel="apple-touch-icon"]')){ const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=icon; document.head.appendChild(al); }
    if(!document.querySelector('link[rel="manifest"]')){
      const man={name:"lil svensk björn",short_name:"Svensk Björn",start_url:".",scope:".",display:"standalone",orientation:"portrait",background_color:"#eef3f6",theme_color:"#2f6fb0",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
      const ml=document.createElement("link"); ml.rel="manifest"; ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"})); document.head.appendChild(ml);
    }
  }catch(e){} })();

render();
</script>
